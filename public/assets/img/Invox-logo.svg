<svg width="140" height="40" viewBox="0 0 140 40" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Rounded square icon background - same purple as Invoify -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#7C6FF7"/>

  <!-- Letter I inside the box -->
  <text
    x="20"
    y="29"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="800"
    fill="white"
    text-anchor="middle"
  >I</text>

  <!-- Full wordmark "Invox" next to the icon -->
  <text
    x="52"
    y="29"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="white"
    letter-spacing="0.3"
  >Invox</text>

</svg>
